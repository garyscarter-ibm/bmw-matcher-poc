<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Your Car</title>
  <meta name="description" content="A few quick questions about your life, your miles and your budget. We match you against the approved-used cars your retailer actually has, and tell you why.">
  <meta property="og:title" content="Find Your Car">
  <meta property="og:description" content="A few questions. Then the approved-used cars at your retailer that genuinely suit you, the reasons why, and a straight answer when none of them do.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="./blocks/vehicle-matcher/vehicle-matcher.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0f12;
      padding: 4vh 16px;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', helvetica, arial, sans-serif;
    }
    /* The harness stands in for a host page, so IT owns the page surface. The block
       itself is transparent (the host section decides its background), so this white lives here. */
    main {
      width: 100%; max-width: 880px; margin: 0 auto; box-sizing: border-box;
      background: #fff;
    }
    /* Shared-password gate: a full-screen overlay over the harness's dark surface,
       purely for capturing the demo password (see the module script). The server is the real gate. */
    .vm-gate {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0d0f12;
    }
    .vm-gate-card {
      width: 100%; max-width: 360px; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 12px;
      padding: 32px 28px; border-radius: 12px;
      background: #16191e; color: #f2f4f7;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .vm-gate-title { margin: 0; font-size: 22px; font-weight: 600; }
    .vm-gate-lede { margin: 0; font-size: 14px; line-height: 1.4; color: #aeb4bd; }
    .vm-gate-error { margin: 0; font-size: 14px; color: #ff8a80; }
    .vm-gate-input {
      box-sizing: border-box; width: 100%; margin-top: 4px;
      padding: 12px 14px; font-size: 16px;
      border: 1px solid #3a3f47; border-radius: 8px;
      background: #0d0f12; color: #f2f4f7;
    }
    .vm-gate-input:focus { outline: 2px solid #4c8bf5; outline-offset: 1px; }
    .vm-gate-btn {
      padding: 12px 14px; font-size: 15px; font-weight: 600; cursor: pointer;
      border: 0; border-radius: 8px; background: #4c8bf5; color: #fff;
    }
    .vm-gate-btn:hover { background: #3f79db; }
  </style>
</head>
<body>
  <main>
    <!-- Standalone harness: mounts the block as EDS would, simulating the block-config table Adobe DA renders (each row -> key/value <div>s, per aem-boilerplate's readBlockConfig). Brand-agnostic; defaults to BMW/Grassicks with data-api at localhost:8787.
         Query-string overrides: ?brand=bmw|mini|... ?retailer=<id> ?mode=<questionnaire|swipe|head-to-head|podium> ?api=<url>. No Mode row is authored on purpose: unlocked, the block shows its mode switcher — this page IS the multi-interface showcase. -->
    <div class="vehicle-matcher block" data-block-name="vehicle-matcher" data-api="http://localhost:8787">
      <div>
        <div>Brand</div>
        <div>BMW</div>
      </div>
      <div>
        <div>Retailer ID</div>
        <div>96</div>
      </div>
      <div>
        <div>Retailer Name</div>
        <div>Grassicks BMW</div>
      </div>
    </div>
  </main>
  <script type="module">
    import decorate from './blocks/vehicle-matcher/vehicle-matcher.js';
    import { ACCESS_KEY_STORAGE } from './blocks/vehicle-matcher/engine.js';

    const block = document.querySelector('.vehicle-matcher');
    const params = new URLSearchParams(window.location.search);

    // ?api=<url> points the block at a deployed backend (e.g. Render) — else it
    // falls back to the data-api attribute's localhost default for local dev.
    const apiOverride = params.get('api');
    if (apiOverride) {
      block.dataset.api = apiOverride;
    }

    // Rewrite an authored config row's value in place, found by its label so the
    // right row is hit regardless of order. (?mode is read by the block itself, no row needed.)
    const setRow = (label, value) => {
      const row = [...block.children].find(
        (r) => r.firstElementChild?.textContent.trim().toLowerCase() === label,
      );
      if (row) row.lastElementChild.textContent = value;
    };

    // ?brand=bmw|mini|honda|ford|motorrad overrides the authored Brand row.
    const brandOverride = params.get('brand');
    if (brandOverride) setRow('brand', brandOverride);

    // ?retailer=<id> overrides the authored Retailer ID row.
    const retailerOverride = params.get('retailer');
    if (retailerOverride) setRow('retailer id', retailerOverride);

    // Retailer *Name* is a separate authored row, so ?brand= alone would leave it as the
    // BMW default; each brand carries its own default name (national programmes for Honda/Ford/Motorrad). Precedence: ?retailerName= > ?retailer= ID map > ?brand= default.
    const BRAND_RETAILER_NAMES = {
      bmw: 'Grassicks BMW', // Grassicks Garage, Perth (retailer 96)
      mini: 'Sytner Luton MINI', // retailer 92
      honda: 'Honda Approved Used',
      ford: 'Ford Approved Used',
      motorrad: 'BMW Motorrad Approved Used',
      ferrari: 'Ferrari Approved',
    };
    const RETAILER_NAMES = {
      96: 'Grassicks BMW', // Grassicks Garage, Perth
      92: 'Sytner Luton MINI',
    };
    const nameOverride = params.get('retailerName')
      || RETAILER_NAMES[retailerOverride]
      || (brandOverride && BRAND_RETAILER_NAMES[brandOverride.toLowerCase()]);
    if (nameOverride) setRow('retailer name', nameOverride);

    // ---- Shared-password gate ---------------------------------------------
    // UX only, not a security boundary: captures the shared demo password so engine.js sends it as X-Access-Key. The server is the real gate (401s /api/* without a matching key; runs open when DEMO_ACCESS_KEY is unset).
    // ?key=<password> lets a shareable link carry the password: we store it and strip it from the visible URL so it isn't shoulder-surfed or left in history.
    const keyFromUrl = params.get('key');
    if (keyFromUrl) {
      sessionStorage.setItem(ACCESS_KEY_STORAGE, keyFromUrl);
      params.delete('key');
      const clean = params.toString();
      window.history.replaceState(
        {},
        '',
        window.location.pathname + (clean ? `?${clean}` : '') + window.location.hash,
      );
    }

    // Build (or re-build) the password overlay. `message` shows the wrong-password note
    // on a retry. Resolves once the user submits a non-empty password (stored before resolving).
    function askForPassword(message) {
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'vm-gate';
        overlay.innerHTML = `
          <form class="vm-gate-card" autocomplete="off">
            <h1 class="vm-gate-title">Private demo</h1>
            <p class="vm-gate-lede">Enter the password you were given to continue.</p>
            ${message ? `<p class="vm-gate-error">${message}</p>` : ''}
            <input class="vm-gate-input" type="password" name="vm-access"
                   placeholder="Password" aria-label="Password" autofocus>
            <button class="vm-gate-btn" type="submit">Enter</button>
          </form>`;
        const form = overlay.querySelector('.vm-gate-card');
        const input = overlay.querySelector('.vm-gate-input');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const value = input.value.trim();
          if (!value) return;
          sessionStorage.setItem(ACCESS_KEY_STORAGE, value);
          overlay.remove();
          resolve();
        });
        document.body.append(overlay);
        input.focus();
      });
    }

    // A 401 from a load-bearing call means the stored password was wrong or rotated:
    // engine.js clears it and fires vm-auth-failed. Re-prompt, then remount against the fresh key.
    window.addEventListener('vm-auth-failed', () => {
      // Guard against re-entrancy if two calls 401 at once.
      if (document.querySelector('.vm-gate')) return;
      askForPassword('That password was not right. Please try again.')
        .then(() => decorate(block));
    });

    // Skip the up-front prompt when running locally: a keyless local backend returns 200 without a key, so a prompt is pure friction. Both a locally-served page and a localhost API count as "local".
    // The vm-auth-failed handler above stays the real gate for the (unexpected) case where a local server is keyed. Mirrors index.html.
    const pageIsLocal = window.location.protocol === 'file:'
      || ['localhost', '127.0.0.1', '::1', '[::1]', ''].includes(window.location.hostname);
    const apiHost = (() => {
      try { return new URL(block.dataset.api, window.location.href).hostname; }
      catch { return ''; }
    })();
    const apiIsLocal = apiHost === 'localhost' || apiHost === '127.0.0.1' || apiHost === '::1';

    // Have a key already (this session, or just set from ?key=), or running
    // locally? Mount straight away. Otherwise prompt first, then mount.
    if (sessionStorage.getItem(ACCESS_KEY_STORAGE) || pageIsLocal || apiIsLocal) {
      decorate(block);
    } else {
      askForPassword().then(() => decorate(block));
    }
  </script>
</body>
</html>
