name: Deploy to GitHub Pages

# Publishes the static block + harness to GitHub Pages.
#
# A repo gets exactly ONE Pages site, which is why two branches can't each have
# their own deployment. They don't need one: a Pages site is just a directory
# tree, so this workflow assembles both versions into a single upload —
#
#   /        → main            (the current published version)
#   /next/   → NEXT_BRANCH     (the work in progress, side by side with it)
#
# Both are rebuilt on a push to either branch, so the pair never drifts. Every
# path in the harness is relative (`./blocks/…`), so the same files work
# unchanged at either depth — no rewriting, no separate build.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main, question-overhaul]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The branch published at /next/. Change this to point the preview slot at
  # different work; delete the branch and the site still deploys with just main
  # (the checkout below is allowed to fail).
  NEXT_BRANCH: question-overhaul

  # Backend each version talks to, baked into its copy of the harness at deploy
  # time so a shared link needs no query string. The two versions run different
  # engines and must not share a backend: /next/ expects an API that sends
  # `decisive`/`clusterSize` and per-car colour, which main's does not.
  #
  # Leave either blank to skip the substitution — that version then keeps the
  # localhost default and needs the usual ?api=<url> override. `?api=` keeps
  # working regardless, so a deployed page can always be pointed elsewhere.
  API_URL_MAIN: https://bmw-matcher-api.onrender.com
  API_URL_NEXT: https://bmw-matcher-api-wl6w.onrender.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-main

      - name: Check out the preview branch
        id: next
        uses: actions/checkout@v4
        continue-on-error: true # merged or deleted → publish main alone
        with:
          ref: ${{ env.NEXT_BRANCH }}
          path: src-next

      # Only the files the browser actually asks for. The repo root also holds
      # server/, scripts/ and ~16MB of stock fixtures, none of which a static
      # page needs — the old `path: '.'` shipped the lot on every deploy.
      - name: Assemble the site
        run: |
          set -euo pipefail

          stage() {
            local src="$1" dest="$2" api="$3"
            mkdir -p "$dest"
            cp -R "$src/index.html" "$src/index-mini.html" "$src/blocks" "$dest/"
            if [ -n "$api" ]; then
              # The harness hardcodes the local default; point it at the
              # deployed backend for this slot. Exact match, so it can only
              # ever rewrite that one attribute.
              find "$dest" -maxdepth 1 -name '*.html' -exec \
                sed -i "s|data-api=\"http://localhost:8787\"|data-api=\"$api\"|g" {} +
            fi
          }

          stage src-main _site "${API_URL_MAIN}"

          if [ -d src-next ]; then
            stage src-next _site/next "${API_URL_NEXT}"
          else
            echo "::notice::${NEXT_BRANCH} not found — publishing main only."
          fi

          echo "Published tree:"
          find _site -maxdepth 2 -name '*.html' | sort
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
