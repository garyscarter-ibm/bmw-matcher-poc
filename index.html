<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Your Car — in place</title>
  <meta name="description" content="A demonstration of the vehicle-matcher tool sitting inside brand-homepage chrome. Internal demo only — not an official brand site.">
  <link rel="stylesheet" href="./blocks/vehicle-matcher/vehicle-matcher.css">
  <link rel="stylesheet" href="./blocks/vehicle-matcher/demo-chrome.css">
  <style>
    /* This page owns the page surface; the shell + picker paint their own. */
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: #0d0f12;
      font-family: 'Helvetica Neue', helvetica, arial, sans-serif;
    }

    /* Shared-password gate — carried over verbatim from block.html. This overlay
       is UX only, not a security boundary: it captures the shared demo password
       so engine.js can send it as X-Access-Key. The server is the real gate. */
    .vm-gate {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0d0f12;
    }
    .vm-gate-card {
      width: 100%; max-width: 360px; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 12px;
      padding: 32px 28px; border-radius: 12px;
      background: #16191e; color: #f2f4f7;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .vm-gate-title { margin: 0; font-size: 22px; font-weight: 600; }
    .vm-gate-lede { margin: 0; font-size: 14px; line-height: 1.4; color: #aeb4bd; }
    .vm-gate-error { margin: 0; font-size: 14px; color: #ff8a80; }
    .vm-gate-input {
      box-sizing: border-box; width: 100%; margin-top: 4px;
      padding: 12px 14px; font-size: 16px;
      border: 1px solid #3a3f47; border-radius: 8px;
      background: #0d0f12; color: #f2f4f7;
    }
    .vm-gate-input:focus { outline: 2px solid #4c8bf5; outline-offset: 1px; }
    .vm-gate-btn {
      padding: 12px 14px; font-size: 15px; font-weight: 600; cursor: pointer;
      border: 0; border-radius: 8px; background: #4c8bf5; color: #fff;
    }
    .vm-gate-btn:hover { background: #3f79db; }
  </style>
</head>
<body>
  <!-- The whole page is built by the module below: either the neutral brand
       picker (no ?brand=) or the themed shell wrapping the real block. Nothing
       is authored statically here so one page serves all five brands and the
       picker off the same content map. -->
  <div id="demo-root"></div>

  <script type="module">
    import decorate from './blocks/vehicle-matcher/vehicle-matcher.js';
    import { ACCESS_KEY_STORAGE } from './blocks/vehicle-matcher/engine.js';

    const root = document.getElementById('demo-root');
    const params = new URLSearchParams(window.location.search);

    // ------------------------------------------------------------------
    // Per-brand chrome content. CHROME COPY ONLY — the block's own retailer
    // names still come from BRAND_RETAILER_NAMES below (carried over from
    // block.html). Origins verified in server/brands.js. Voice drawn from the
    // brands' documented tone (questionnaire.js BRAND_COPY, docs/tone-style-guide.md).
    // No em dashes in on-screen copy (house style).
    //
    // logo:   /assets/brand-logos/<brand>.svg if present, else the text wordmark
    //         fallback renders automatically (img onerror).
    // hero:   /assets/brand-hero/<brand>.jpg if present, else the hero falls back
    //         to the token accent band (.is-plain). Both assets are brand-owned
    //         marketing material, committed for THIS internal pitch demo only —
    //         do not ship to production (see the plan's licensing note).
    // ------------------------------------------------------------------
    const BRANDS = {
      bmw: {
        label: 'BMW',
        origin: 'usedcars.bmw.co.uk',
        navLinks: ['Models', 'Approved Used', 'Offers', 'Book a Test Drive'],
        heroKicker: 'BMW Approved Used',
        heroTitle: 'Find Your BMW.',
        heroSub: 'Sheer driving pleasure, matched to how you actually drive.',
        heroCta: 'Start matching',
        footerLinks: ['Legal', 'Privacy', 'Cookies', 'Contact'],
        footerNote: 'Internal demonstration only. This is a prototype of the '
          + 'vehicle-matcher tool shown inside representative brand furniture. It '
          + 'is not an official BMW site and is not affiliated with or endorsed '
          + 'by BMW.',
      },
      mini: {
        label: 'MINI',
        origin: 'approvedusedminis.co.uk',
        navLinks: ['Range', 'Approved Used', 'Offers', 'Book a Test Drive'],
        heroKicker: 'MINI Approved Used',
        heroTitle: 'Find Your MINI.',
        heroSub: 'Go-kart feeling, with your name on it.',
        heroCta: 'Start matching',
        footerLinks: ['Legal', 'Privacy', 'Cookies', 'Contact'],
        footerNote: 'Internal demonstration only. This is a prototype of the '
          + 'vehicle-matcher tool shown inside representative brand furniture. It '
          + 'is not an official MINI site and is not affiliated with or endorsed '
          + 'by MINI.',
      },
      ford: {
        label: 'Ford',
        origin: 'www.ford.co.uk',
        navLinks: ['Vehicles', 'Approved Used', 'Offers', 'Find a Dealer'],
        heroKicker: 'Ford Approved Used',
        heroTitle: 'Find the right Ford for you.',
        heroSub: 'Sensible, well priced and built for real British life.',
        heroCta: 'Start matching',
        footerLinks: ['Legal', 'Privacy', 'Cookies', 'Contact'],
        footerNote: 'Internal demonstration only. This is a prototype of the '
          + 'vehicle-matcher tool shown inside representative brand furniture. It '
          + 'is not an official Ford site and is not affiliated with or endorsed '
          + 'by Ford.',
      },
      honda: {
        label: 'Honda',
        origin: 'usedcars.honda.co.uk',
        navLinks: ['Cars', 'Approved Used', 'Offers', 'Find a Dealer'],
        heroKicker: 'Honda Approved Used',
        heroTitle: 'Find the right Honda for you.',
        heroSub: 'A car that genuinely suits how you live, and shows its working.',
        heroCta: 'Start matching',
        footerLinks: ['Legal', 'Privacy', 'Cookies', 'Contact'],
        footerNote: 'Internal demonstration only. This is a prototype of the '
          + 'vehicle-matcher tool shown inside representative brand furniture. It '
          + 'is not an official Honda site and is not affiliated with or endorsed '
          + 'by Honda.',
      },
      motorrad: {
        label: 'BMW Motorrad',
        origin: 'approvedused.bmw-motorrad.co.uk',
        navLinks: ['Bikes', 'Approved Used', 'Offers', 'Book a Test Ride'],
        heroKicker: 'BMW Motorrad Approved Used',
        heroTitle: 'Make Life a Ride.',
        heroSub: 'The approved-used bike built for the road you ride.',
        heroCta: 'Start matching',
        footerLinks: ['Legal', 'Privacy', 'Cookies', 'Contact'],
        footerNote: 'Internal demonstration only. This is a prototype of the '
          + 'vehicle-matcher tool shown inside representative brand furniture. It '
          + 'is not an official BMW Motorrad site and is not affiliated with or '
          + 'endorsed by BMW Motorrad.',
      },
      // Ferrari's voice is Italian, romantic and heritage-led: a Ferrarista
      // joining a bloodline, not a shopper. It leads on the drive and the feeling,
      // names the official "Ferrari Approved" programme, and stays warm and
      // unhurried (see BRAND_COPY.ferrari in modes/questionnaire.js). No em dashes.
      ferrari: {
        label: 'Ferrari',
        origin: 'preowned.ferrari.com',
        navLinks: ['Range', 'Ferrari Approved', 'The Marque', 'Find a Dealer'],
        heroKicker: 'Ferrari Approved',
        heroTitle: 'The one that was made for you.',
        heroSub: 'Every approved-used Ferrari, matched to the way you drive and '
          + 'the roads you love.',
        heroCta: 'Start matching',
        footerLinks: ['Legal', 'Privacy', 'Cookies', 'Contact'],
        footerNote: 'Internal demonstration only. This is a prototype of the '
          + 'vehicle-matcher tool shown inside representative brand furniture. It '
          + 'is not an official Ferrari site and is not affiliated with or '
          + 'endorsed by Ferrari.',
      },
    };

    // Picker tile order (BMW, MINI, Ford, Honda, Motorrad, Ferrari).
    const PICKER_ORDER = ['bmw', 'mini', 'ford', 'honda', 'motorrad', 'ferrari'];

    // ---- carried over verbatim from block.html ------------------------------
    // Each brand's default demo retailer name, so switching brand alone doesn't
    // leave a mismatched "...at Grassicks BMW". Honda/Ford/Motorrad are national
    // programmes, so they use the programme name. Precedence: ?retailerName=
    // beats the ?retailer= ID map beats the ?brand= default.
    const BRAND_RETAILER_NAMES = {
      bmw: 'Grassicks BMW', // Grassicks Garage, Perth (retailer 96)
      mini: 'Sytner Luton MINI', // retailer 92
      honda: 'Honda Approved Used',
      ford: 'Ford Approved Used',
      motorrad: 'BMW Motorrad Approved Used',
      ferrari: 'Ferrari Approved',
    };
    const RETAILER_NAMES = {
      96: 'Grassicks BMW', // Grassicks Garage, Perth
      92: 'Sytner Luton MINI',
    };
    const BRAND_RETAILER_IDS = { bmw: '96', mini: '92' };

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    // Small helper — a nav/footer link list as HTML (chrome only, inert hrefs).
    const linkList = (items) => items
      .map((l) => `<a href="#" onclick="return false">${esc(l)}</a>`)
      .join('');

    // A brand logo as a real DOM node: an <img> pointing at the committed SVG,
    // that quietly replaces ITSELF with a styled text wordmark if the file is
    // missing (so a brand with no committed mark still renders on-brand). Built
    // as a node with a real error listener rather than an inline onerror string
    // — a JSON label inside a double-quoted onerror attribute inside a template
    // literal breaks the HTML parser (double-quote collision). This avoids all
    // of that.
    function logoNode(key, label, textClass) {
      const img = document.createElement('img');
      img.src = `assets/brand-logos/${key}.svg`;
      img.alt = label;
      img.addEventListener('error', () => {
        const span = document.createElement('span');
        span.className = textClass;
        span.textContent = label;
        img.replaceWith(span);
      });
      return img;
    }

    // ------------------------------------------------------------------
    // Brand picker: the neutral landing splash (no ?brand=). Plain links reload
    // into the themed shell, so no history juggling.
    // ------------------------------------------------------------------
    function renderPicker() {
      root.innerHTML = `
        <div class="demo-picker">
          <div class="demo-picker-grid"></div>
        </div>`;

      // Build the tiles as nodes so the logo carries a real error-fallback (see
      // logoNode). Each tile always also shows a text label under the mark.
      const grid = root.querySelector('.demo-picker-grid');
      PICKER_ORDER.forEach((key) => {
        const b = BRANDS[key];
        const tile = document.createElement('a');
        tile.className = 'demo-picker-tile';
        // Carry the current query through the hop, overriding only the brand.
        // These are plain links that reload the page, so a hand-built
        // `?brand=x` silently dropped every other param: ?api= pointed the demo
        // at a specific backend, then the first tile click sent it back to the
        // default. ?retailer=, ?retailerName= and ?mode= were lost the same way.
        // ?key= is already stripped from params below (it moves into
        // sessionStorage), so the password cannot leak back into a URL here.
        const query = new URLSearchParams(params);
        query.set('brand', key);
        tile.href = `?${query}`;
        // The mark sits on a white plate so it reads on the dark tile (see
        // .demo-picker-logo). Its error-fallback wordmark lands on that same
        // plate, so it carries the label class that the plate darkens.
        const plate = document.createElement('span');
        plate.className = 'demo-picker-logo';
        plate.append(logoNode(key, b.label, 'demo-picker-tile-label'));
        tile.append(plate);
        const label = document.createElement('span');
        label.className = 'demo-picker-tile-label';
        label.textContent = b.label;
        tile.append(label);
        grid.append(tile);
      });
    }

    // ------------------------------------------------------------------
    // Themed shell: nav + hero + tool section + footer, wrapping the real block.
    // The wrapper carries `vm vm-<brand> demo-shell` so brand tokens cascade to
    // the chrome (see demo-chrome.css for how the .vm layout is neutralised).
    // Returns the .vehicle-matcher block element ready to decorate.
    // ------------------------------------------------------------------
    function renderShell(brandKey) {
      const b = BRANDS[brandKey];
      const retailerName = BRAND_RETAILER_NAMES[brandKey] || '';
      const retailerId = BRAND_RETAILER_IDS[brandKey] || '';

      root.innerHTML = `
        <div class="vm vm-${brandKey} demo-shell" data-brand="${brandKey}">
          <header class="demo-nav">
            <span class="demo-nav-logo"></span>
            <nav class="demo-nav-links">${linkList(b.navLinks)}</nav>
            <span class="demo-nav-spacer"></span>
            <a class="demo-nav-back" href="https://${b.origin}" target="_blank" rel="noopener">Back to the real ${esc(b.origin)}</a>
          </header>

          <section class="demo-hero" id="demo-hero">
            <div class="demo-hero-inner">
              <p class="demo-hero-kicker">${esc(b.heroKicker)}</p>
              <h1 class="demo-hero-title">${esc(b.heroTitle)}</h1>
              <p class="demo-hero-sub">${esc(b.heroSub)}</p>
              <a class="demo-cta" href="#demo-tool">${esc(b.heroCta)}</a>
            </div>
          </section>

          <section class="demo-tool" id="demo-tool">
            <div class="vehicle-matcher block" data-block-name="vehicle-matcher" data-api="${DEFAULT_API}">
              <div><div>Brand</div><div>${brandKey}</div></div>
              <div><div>Retailer ID</div><div>${esc(retailerId)}</div></div>
              <div><div>Retailer Name</div><div>${esc(retailerName)}</div></div>
              <div><div>Title</div><div>none</div></div>
            </div>
          </section>

          <footer class="demo-footer">
            <div class="demo-footer-inner">
              <nav class="demo-footer-links">${linkList(b.footerLinks)}</nav>
              <span class="demo-footer-spacer"></span>
              <p class="demo-footer-note">${esc(b.footerNote)}</p>
            </div>
          </footer>
        </div>`;

      // Nav logo: insert the mark (with its text-wordmark error fallback).
      root.querySelector('.demo-nav-logo').append(logoNode(brandKey, b.label, 'demo-logo-text'));

      // Hero photo, set inline. If the image can't load, drop to the token
      // accent band (.is-plain) rather than showing a broken/blank hero.
      const hero = document.getElementById('demo-hero');
      const heroUrl = `assets/brand-hero/${brandKey}.jpg`;
      const probe = new Image();
      probe.onload = () => { hero.style.backgroundImage = `url("${heroUrl}")`; };
      probe.onerror = () => { hero.classList.add('is-plain'); };
      probe.src = heroUrl;

      return root.querySelector('.vehicle-matcher');
    }

    // ------------------------------------------------------------------
    // Query overrides on the block's authored config rows — mirrors block.html.
    // ------------------------------------------------------------------
    function applyOverrides(block) {
      // ?api=<url> points the block at a deployed backend; else the data-api
      // localhost default holds for local dev.
      const apiOverride = params.get('api');
      if (apiOverride) block.dataset.api = apiOverride;

      // Rewrite an authored config row's value in place, found by its label.
      const setRow = (label, value) => {
        const row = [...block.children].find(
          (r) => r.firstElementChild?.textContent.trim().toLowerCase() === label,
        );
        if (row) row.lastElementChild.textContent = value;
      };

      const brandOverride = params.get('brand');
      if (brandOverride) setRow('brand', brandOverride);

      const retailerOverride = params.get('retailer');
      if (retailerOverride) setRow('retailer id', retailerOverride);

      // Retailer-name precedence: ?retailerName= > RETAILER_NAMES[id] >
      // BRAND_RETAILER_NAMES[brand].
      const nameOverride = params.get('retailerName')
        || RETAILER_NAMES[retailerOverride]
        || (brandOverride && BRAND_RETAILER_NAMES[brandOverride.toLowerCase()]);
      if (nameOverride) setRow('retailer name', nameOverride);
      // Title is already authored to "none" in the shell markup to suppress the
      // block's own H1 (the hero owns the headline). ?mode= is read by the block
      // itself, so it needs no row here.
    }

    // ------------------------------------------------------------------
    // Password gate — carried over from block.html, but here it runs before
    // ANY view renders, picker included: the whole demo sits behind the shared
    // password, so a visitor sees the prompt rather than the brand tiles.
    // ------------------------------------------------------------------

    // The backend the block will talk to. Authored as the shell's data-api and
    // resolved up front too, so the gate can tell local dev from a deployed API
    // before there is a block to read it off.
    //
    // Derived from where the PAGE is served rather than hardcoded, because the
    // Pages deploy rewrite cannot reach this value. That step seds a data-api
    // attribute whose value is the localhost URL spelled out in full, which
    // block.html has but this file does not: the shell authors it as the
    // ${DEFAULT_API} placeholder, which the pattern never matches. So the
    // published homepage kept calling localhost from an https origin, which the
    // browser reports as a CORS failure, and the gate below read the same stale
    // value and skipped the password prompt while the block called a keyed API
    // bare. Reading window.location is right on every host with no build step
    // involved. (Do not write that attribute-and-value literal anywhere in this
    // file: the deploy would rewrite it, including inside a comment.)
    //
    // Keep REMOTE_API in step with API_URL in .github/workflows/pages.yml; that
    // env var still drives block.html's rewrite.
    const LOCAL_API = 'http://localhost:8787';
    const REMOTE_API = 'https://bmw-matcher-api.onrender.com';
    const pageIsLocal = window.location.protocol === 'file:'
      || ['localhost', '127.0.0.1', '::1', '[::1]', ''].includes(window.location.hostname);
    const DEFAULT_API = pageIsLocal ? LOCAL_API : REMOTE_API;

    const keyFromUrl = params.get('key');
    if (keyFromUrl) {
      sessionStorage.setItem(ACCESS_KEY_STORAGE, keyFromUrl);
      params.delete('key');
      const clean = params.toString();
      window.history.replaceState(
        {}, '',
        window.location.pathname + (clean ? `?${clean}` : '') + window.location.hash,
      );
    }

    function askForPassword(message) {
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'vm-gate';
        overlay.innerHTML = `
          <form class="vm-gate-card" autocomplete="off">
            <h1 class="vm-gate-title">Private demo</h1>
            <p class="vm-gate-lede">Enter the password you were given to continue.</p>
            ${message ? `<p class="vm-gate-error">${message}</p>` : ''}
            <input class="vm-gate-input" type="password" name="vm-access"
                   placeholder="Password" aria-label="Password" autofocus>
            <button class="vm-gate-btn" type="submit">Enter</button>
          </form>`;
        const form = overlay.querySelector('.vm-gate-card');
        const input = overlay.querySelector('.vm-gate-input');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const value = input.value.trim();
          if (!value) return;
          sessionStorage.setItem(ACCESS_KEY_STORAGE, value);
          overlay.remove();
          resolve();
        });
        document.body.append(overlay);
        input.focus();
      });
    }

    // ------------------------------------------------------------------
    // Boot: gate first, then pick the view.
    // ------------------------------------------------------------------

    // Render the chosen view. Called only once the gate has cleared, so neither
    // the picker tiles nor a branded shell is ever painted behind the overlay.
    function render() {
      const brandParam = (params.get('brand') || '').toLowerCase();

      if (!brandParam) {
        // No brand chosen — show the neutral picker and stop.
        renderPicker();
        return;
      }

      // Unknown brand falls back to bmw, matching the block's own DEFAULT_BRAND.
      const brandKey = BRANDS[brandParam] ? brandParam : 'bmw';
      const block = renderShell(brandKey);
      applyOverrides(block);

      // A 401 on a load-bearing call clears the stored key and fires
      // vm-auth-failed; re-prompt and remount. This is the real gate: it fires
      // whenever the server actually rejects a request, whatever we assumed
      // below — so a keyed server still prompts even on localhost.
      window.addEventListener('vm-auth-failed', () => {
        if (document.querySelector('.vm-gate')) return;
        askForPassword('That password was not right. Please try again.')
          .then(() => decorate(block));
      });

      decorate(block);
    }

    // Whether to prompt for the password up front. A local dev backend runs
    // keyless (DEMO_ACCESS_KEY unset -> auth off, see server/index.js), so a
    // pre-emptive prompt on localhost is pure friction: the server returns 200
    // without a key. So when the page is served locally (pageIsLocal, computed
    // above) OR it points at a localhost API we render straight away and let the
    // vm-auth-failed handler in render() catch the (unexpected) case where that
    // local server *is* keyed. A remote/deployed API keeps the up-front prompt,
    // and it lands before the brand tiles rather than after.
    const apiHost = (() => {
      try { return new URL(params.get('api') || DEFAULT_API, window.location.href).hostname; }
      catch { return ''; }
    })();
    const apiIsLocal = apiHost === 'localhost' || apiHost === '127.0.0.1' || apiHost === '::1';

    if (sessionStorage.getItem(ACCESS_KEY_STORAGE) || pageIsLocal || apiIsLocal) {
      render();
    } else {
      askForPassword().then(render);
    }
  </script>
</body>
</html>
