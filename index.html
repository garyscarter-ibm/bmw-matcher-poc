<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Your Car</title>
  <meta name="description" content="A few quick questions about your life, your miles and your budget. We match you against the approved-used cars your retailer actually has, and tell you why.">
  <meta property="og:title" content="Find Your Car">
  <meta property="og:description" content="A few questions. Then the approved-used cars at your retailer that genuinely suit you, the reasons why, and a straight answer when none of them do.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="./blocks/vehicle-matcher/vehicle-matcher.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0f12;
      padding: 4vh 16px;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', helvetica, arial, sans-serif;
    }
    /* The harness stands in for a host page, so IT owns the page surface.
       The block itself is transparent (the host section decides its
       background), which is why this white lives here and not there.
       Matches the block's own 1280px column (vehicle-matcher.css `.vm`) so the
       white surface ends where the block does — a narrower wrapper here would
       clamp the block back down and hide the change. */
    main {
      width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box;
      background: #fff;
    }
    /* Shared-password gate: a full-screen overlay over the harness's dark
       surface. Purely for capturing the demo password (see the module script);
       the server is the real gate. */
    .vm-gate {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0d0f12;
    }
    .vm-gate-card {
      width: 100%; max-width: 360px; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 12px;
      padding: 32px 28px; border-radius: 12px;
      background: #16191e; color: #f2f4f7;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .vm-gate-title { margin: 0; font-size: 22px; font-weight: 600; }
    .vm-gate-lede { margin: 0; font-size: 14px; line-height: 1.4; color: #aeb4bd; }
    .vm-gate-error { margin: 0; font-size: 14px; color: #ff8a80; }
    .vm-gate-input {
      box-sizing: border-box; width: 100%; margin-top: 4px;
      padding: 12px 14px; font-size: 16px;
      border: 1px solid #3a3f47; border-radius: 8px;
      background: #0d0f12; color: #f2f4f7;
    }
    .vm-gate-input:focus { outline: 2px solid #4c8bf5; outline-offset: 1px; }
    .vm-gate-btn {
      padding: 12px 14px; font-size: 15px; font-weight: 600; cursor: pointer;
      border: 0; border-radius: 8px; background: #4c8bf5; color: #fff;
    }
    .vm-gate-btn:hover { background: #3f79db; }
  </style>
</head>
<body>
  <main>
    <!-- Standalone harness: mounts the block exactly as EDS would.
         The block is brand-agnostic — the "Brand" config row (below) chooses
         which marque it themes and sources stock for. This demo defaults to
         BMW; ?brand=mini (or any registered brand) switches it at runtime.

         data-api points the block at the matching backend; in a live EDS site
         you'd set this per-environment. Defaults to http://localhost:8787.
         Override at runtime with ?api=<url> — used by the GitHub Pages build to
         point the static page at the deployed backend without a rebuild.

         The config rows below simulate what Adobe DA (Document Authoring)
         renders from an authored block-config table: each row under the block
         name becomes a child <div> with two nested <div> cells (key, value) —
         the same shape aem-boilerplate's readBlockConfig() reads. A real
         retailer page would set these in their DA document; here they're
         defaults for local dev, overridable via the query string:
           ?brand=bmw|mini   — which brand to theme + source
           ?retailer=<id>    — which retailer's stock
           ?scope=dealer|national — that retailer's forecourt, or the whole
                               network (BMW/MINI only; default dealer)
           ?mode=<key>       — lock to one interface (else the switcher shows)
           ?api=<url>        — point at a deployed backend

         No "Mode" or "Scope" row is authored here on purpose: both are read
         from the query string by the block itself, and unlocked the block shows
         its mode switcher — this page IS the multi-interface showcase.

         Retailer Name is authored to match the DEFAULT scope, but the script
         below re-derives it whenever brand or scope changes, because one
         hardcoded label cannot be true for both scopes. -->
    <div class="vehicle-matcher block" data-block-name="vehicle-matcher" data-api="http://localhost:8787">
      <div>
        <div>Brand</div>
        <div>BMW</div>
      </div>
      <div>
        <div>Retailer ID</div>
        <div>96</div>
      </div>
      <div>
        <div>Retailer Name</div>
        <div>Grassicks Garage</div>
      </div>
    </div>
  </main>
  <script type="module">
    import decorate from './blocks/vehicle-matcher/vehicle-matcher.js';
    import { ACCESS_KEY_STORAGE } from './blocks/vehicle-matcher/engine.js';

    const block = document.querySelector('.vehicle-matcher');
    const params = new URLSearchParams(window.location.search);

    // ?api=<url> points the block at a deployed backend (e.g. Render) — else it
    // falls back to the data-api attribute's localhost default for local dev.
    const apiOverride = params.get('api');
    if (apiOverride) {
      block.dataset.api = apiOverride;
    }

    // Rewrite an authored config row's value in place, found by its label so
    // the right row is hit regardless of order. Used by the ?brand / ?retailer
    // overrides below. (?mode and ?scope are read by the block itself from the
    // query string, so they need no row here.)
    const findRow = (label) => [...block.children].find(
      (r) => r.firstElementChild?.textContent.trim().toLowerCase() === label,
    );
    const setRow = (label, value) => {
      const row = findRow(label);
      if (row) row.lastElementChild.textContent = value;
    };
    // Read a row back, so the label logic below works from the block's EFFECTIVE
    // config — the authored value, or whatever ?brand / ?retailer just replaced
    // it with — instead of re-deriving that precedence a second time.
    const getRow = (label) => findRow(label)?.lastElementChild.textContent.trim() || '';

    // ?brand=bmw|mini|honda|ford|motorrad overrides the authored Brand row.
    const brandOverride = params.get('brand');
    if (brandOverride) setRow('brand', brandOverride);

    // ?retailer=<id> overrides the authored Retailer ID row.
    const retailerOverride = params.get('retailer');
    if (retailerOverride) setRow('retailer id', retailerOverride);

    // Retailer *Name* is a third authored row: the label the copy uses for the
    // pool it searched ("AT BMW APPROVED USED", "Nothing at … is close to what
    // you asked for"). It is NOT the brand row, so switching brand with ?brand=
    // alone would leave the name as whatever the markup hardcoded — every other
    // brand then read "...at Grassicks BMW". Fix: each brand carries its own
    // default label, applied whenever ?brand= is set.
    //
    // Every label is the brand's national programme, not a single dealer,
    // because that is what the block now searches: BMW and MINI walk the whole
    // national feed (see nationalStock in server/stock.js), so the cards come
    // from ~130 retailers apiece. Naming one branch would claim a pool that was
    // never searched — "Nothing at Sytner Luton MINI is close to what you asked
    // for" over a card reading "At Group 1 Lincoln". Honda/Ford/Motorrad/Ferrari
    // were already national programmes; BMW and MINI have simply joined them.
    const BRAND_RETAILER_NAMES = {
      bmw: 'BMW Approved Used',
      mini: 'MINI Approved Used',
      honda: 'Honda Approved Used',
      ford: 'Ford Approved Used',
      motorrad: 'BMW Motorrad Approved Used',
      ferrari: 'Ferrari Approved',
    };
    // ?retailerName= still overrides it, for demoing a genuinely single-dealer
    // page. Deliberately NOT derived from ?retailer=<id> any more: that row only
    // anchors the "other retailers nearby" postcode lookup (fetchNearbyStock),
    // and no longer narrows the main pool, so an ID can't name it.
    const nameOverride = params.get('retailerName')
      || (brandOverride && BRAND_RETAILER_NAMES[brandOverride.toLowerCase()]);
    if (nameOverride) setRow('retailer name', nameOverride);

    // ---- Shared-password gate ---------------------------------------------
    // This overlay is UX only, not a security boundary: it captures the shared
    // demo password so engine.js can send it as X-Access-Key on every API call.
    // The real gate is the server, which 401s any /api/* call without a matching
    // key (see server/index.js isAuthorized). So bypassing this overlay just
    // yields an empty shell that can't load questions or matches. When the
    // deployed backend has no DEMO_ACCESS_KEY set, any password (or none) works
    // and the app runs open, exactly as before.
    //
    // ?key=<password> lets a single shareable link carry the password: we store
    // it and strip it from the visible URL so it isn't shoulder-surfed or left in
    // history/bookmarks. Rotating the server key invalidates old links, which is
    // the point.
    const keyFromUrl = params.get('key');
    if (keyFromUrl) {
      sessionStorage.setItem(ACCESS_KEY_STORAGE, keyFromUrl);
      params.delete('key');
      const clean = params.toString();
      window.history.replaceState(
        {},
        '',
        window.location.pathname + (clean ? `?${clean}` : '') + window.location.hash,
      );
    }

    // Build (or re-build) the password overlay. `message` shows the wrong-password
    // note on a retry. Resolves once the user submits a non-empty password, which
    // is stored before the promise resolves.
    function askForPassword(message) {
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'vm-gate';
        overlay.innerHTML = `
          <form class="vm-gate-card" autocomplete="off">
            <h1 class="vm-gate-title">Private demo</h1>
            <p class="vm-gate-lede">Enter the password you were given to continue.</p>
            ${message ? `<p class="vm-gate-error">${message}</p>` : ''}
            <input class="vm-gate-input" type="password" name="vm-access"
                   placeholder="Password" aria-label="Password" autofocus>
            <button class="vm-gate-btn" type="submit">Enter</button>
          </form>`;
        const form = overlay.querySelector('.vm-gate-card');
        const input = overlay.querySelector('.vm-gate-input');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const value = input.value.trim();
          if (!value) return;
          sessionStorage.setItem(ACCESS_KEY_STORAGE, value);
          overlay.remove();
          resolve();
        });
        document.body.append(overlay);
        input.focus();
      });
    }

    // A 401 from a load-bearing call means the stored password was wrong or has
    // been rotated: engine.js clears it and fires vm-auth-failed. Re-prompt with
    // the error, then remount the block against the fresh key.
    window.addEventListener('vm-auth-failed', () => {
      // Guard against re-entrancy if two calls 401 at once.
      if (document.querySelector('.vm-gate')) return;
      askForPassword('That password was not right. Please try again.')
        .then(() => decorate(block));
    });

    // Have a key already (this session, or just set from ?key=)? Mount straight
    // away. Otherwise prompt first, then mount.
    if (sessionStorage.getItem(ACCESS_KEY_STORAGE)) {
      decorate(block);
    } else {
      askForPassword().then(() => decorate(block));
    }
  </script>
</body>
</html>
