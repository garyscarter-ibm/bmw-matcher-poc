<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find My Perfect BMW</title>
  <meta name="description" content="Answer ten quick questions and get matched with your perfect BMW from the current UK range.">
  <meta property="og:title" content="Find My Perfect BMW">
  <meta property="og:description" content="Ten questions. Three matches. Your perfect Approved UsedBMW from your local retailer.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="./blocks/bmw-matcher/bmw-matcher.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0f12;
      padding: 4vh 16px;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', helvetica, arial, sans-serif;
    }
    /* Normal flow + auto side margins centre the column without a grid track
       that would size to the block's 880px max-content and overflow narrow
       viewports (the grid centring did exactly that on mobile). */
    main { width: 100%; max-width: 880px; margin: 0 auto; box-sizing: border-box; }
  </style>
</head>
<body>
  <main>
    <!-- Standalone harness: mounts the block exactly as EDS would.
         data-api points the block at the matching backend; in a live EDS site
         you'd set this per-environment. Defaults to http://localhost:8787.
         Override at runtime with ?api=<url> — used by the GitHub Pages build to
         point the static page at the deployed Render backend without a rebuild.

         The "Retailer ID" row below simulates what Adobe DA (Document
         Authoring) renders from an authored block-config table row: each row
         under the block name becomes a child <div> with two nested <div>
         cells (key, value) — the same shape aem-boilerplate's
         readBlockConfig() reads. A real retailer page would set this row's
         value in their DA document; here it's hardcoded for local dev, and
         can be overridden with ?retailer=<id> on this harness's URL for a
         quick multi-retailer demo without editing HTML. -->
    <div class="bmw-matcher block" data-block-name="bmw-matcher" data-api="http://localhost:8787">
      <div>
        <div>Brand</div>
        <div>BMW</div>
      </div>
      <div>
        <div>Retailer ID</div>
        <div>96</div>
      </div>
      <div>
        <div>Retailer Name</div>
        <div>Grassicks BMW</div>
      </div>
    </div>
  </main>
  <script type="module">
    import decorate from './blocks/bmw-matcher/bmw-matcher.js';

    const block = document.querySelector('.bmw-matcher');
    const params = new URLSearchParams(window.location.search);

    // ?api=<url> points the block at a deployed backend (e.g. Render) — else it
    // falls back to the data-api attribute's localhost default for local dev.
    const apiOverride = params.get('api');
    if (apiOverride) {
      block.dataset.api = apiOverride;
    }

    // ?retailer=<id> overrides the authored Retailer ID row (find it by its
    // label so it isn't confused with the Brand / Retailer Name rows).
    const override = params.get('retailer');
    if (override) {
      const row = [...block.children].find(
        (r) => r.firstElementChild?.textContent.trim().toLowerCase() === 'retailer id',
      );
      if (row) row.lastElementChild.textContent = override;
    }

    decorate(block);
  </script>
</body>
</html>
