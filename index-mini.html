<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Your MINI</title>
  <meta name="description" content="A few quick questions about your life, your miles and your money. We match you against the approved-used MINIs your retailer actually has, and tell you why.">
  <meta property="og:title" content="Find Your MINI">
  <meta property="og:description" content="A few questions. Then the approved-used MINIs at your retailer that actually suit you, the reasons why, and a straight answer when none of them do.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="./blocks/bmw-matcher/bmw-matcher.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0f12;
      padding: 4vh 16px;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', helvetica, arial, sans-serif;
    }
    /* The harness stands in for a host page, so IT owns the page surface.
       The block itself is transparent (the host section decides its
       background), which is why this white lives here and not there. */
    main {
      width: 100%; max-width: 880px; margin: 0 auto; box-sizing: border-box;
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <!-- MINI demo harness: same block, configured Brand: MINI so it themes and
         sources from the MINI feed. Retailer 92 = Sytner Luton MINI. See
         index.html for how the DA config rows map to readBlockConfig(). -->
    <div class="bmw-matcher block" data-block-name="bmw-matcher" data-api="http://localhost:8787">
      <div>
        <div>Brand</div>
        <div>MINI</div>
      </div>
      <div>
        <div>Retailer ID</div>
        <div>92</div>
      </div>
      <div>
        <div>Retailer Name</div>
        <div>Sytner Luton MINI</div>
      </div>
    </div>
  </main>
  <script type="module">
    import decorate from './blocks/bmw-matcher/bmw-matcher.js';

    const block = document.querySelector('.bmw-matcher');
    const params = new URLSearchParams(window.location.search);

    const apiOverride = params.get('api');
    if (apiOverride) {
      block.dataset.api = apiOverride;
    }

    // ?retailer=<id> overrides the authored Retailer ID row (found by label).
    const override = params.get('retailer');
    if (override) {
      const row = [...block.children].find(
        (r) => r.firstElementChild?.textContent.trim().toLowerCase() === 'retailer id',
      );
      if (row) row.lastElementChild.textContent = override;
    }

    decorate(block);
  </script>
</body>
</html>
